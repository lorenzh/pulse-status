name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: lorenzh/pulse-config/.github/workflows/check.yml@a3432e0451bb24397e77e48a5ee2e9d46913bd05

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build --tag pulse-status:local .
      - name: Check the image holds no test files
        run: |
          found=$(docker run --rm --entrypoint sh pulse-status:local -c "find /app -type f \( -name '*.test.ts' -o -name '*.spec.ts' \) -not -path '*/node_modules/*'")
          if [ -n "$found" ]; then
            echo "Test files in the image:"
            echo "$found"
            exit 1
          fi
