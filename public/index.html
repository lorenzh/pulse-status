<!doctype html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{title}}</title>
<link rel="stylesheet" href="/theme.css">
<script src="/theme-init.js"></script>
<link rel="stylesheet" href="/page.css">
{{feedLink}}
</head>
<body>
<header>
  <h1>{{wordmark}}</h1>
  <fieldset class="theme-switch" id="theme-switch">
    <legend>Theme</legend>
    <label><input type="radio" name="theme" value="light"> Light</label>
    <label><input type="radio" name="theme" value="dark"> Dark</label>
    <label><input type="radio" name="theme" value="system" checked> System</label>
  </fieldset>
</header>
{{renderedLine}}
<div id="live" role="status" aria-live="polite" aria-atomic="true" class="visually-hidden"></div>
<div id="alert" role="alert" class="visually-hidden"></div>
<div id="banner">{{banner}}</div>
<div id="summary">{{summary}}</div>
<div id="updated">{{updated}}</div>
<section id="manual" aria-label="Ongoing incidents">{{manual}}</section>
<h2 id="checksTitle">{{checksTitle}}</h2>
<div id="checks">{{checks}}</div>
<h2>Incidents</h2>
<div id="incidents">{{incidents}}</div>
<h3>Resolved in the last 7 days</h3>
<div id="resolved">{{resolved}}</div>
<section id="manualResolved" aria-label="Resolved manual incidents">{{manualResolved}}</section>
<h2>Maintenance</h2>
<div id="maintenance">{{maintenance}}</div>
<script type="module" src="/client.js"></script>
</body>
</html>
